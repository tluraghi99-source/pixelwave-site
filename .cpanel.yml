# cPanel Git Version Control deployment script.
# Runs (in order) every time "Deploy HEAD Commit" is clicked in cPanel,
# with the working directory set to this repo's clone path on the VPS.
deployment:
  tasks:
    - ulimit -a
    - ulimit -v unlimited || true
    - export DEPLOYPATH=/home/pixelwave/public_html/
    - export PATH=/opt/cpanel/ea-nodejs22/bin:$PATH
    - export NODE_OPTIONS=--disable-wasm-trap-handler
    - npm ci
    - STRAPI_URL=https://cms.pixelwave.it npm run build
    - /bin/cp -R dist/. $DEPLOYPATH
