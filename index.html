<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PixellWave — Your Vision, Our Wave</title>
    <meta
      name="description"
      content="PixellWave is a creative studio for video, photo, branding, web design, social and events — from concept to final delivery."
    />
    <link rel="canonical" href="https://pixellwave.it/" />
    <meta name="theme-color" content="#000000" />

    <!-- Open Graph — this static baseline is what every page shows when
         shared (Facebook, LinkedIn, WhatsApp, Slack, etc. read the raw
         HTML and never run this site's JS, so per-page OG tags aren't
         possible without server-side rendering). See PageMeta.tsx for the
         per-page <title>/description that DOES vary — search engines like
         Google run JS and do pick that up, unlike link-preview crawlers. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PixellWave" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://pixellwave.it/" />
    <meta property="og:title" content="PixellWave — Your Vision, Our Wave" />
    <meta
      property="og:description"
      content="A creative studio for video, photo, branding, web design, social and events — from concept to final delivery."
    />
    <meta property="og:image" content="https://pixellwave.it/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter/X reads Open Graph too, but only with this card type set
         does it render the large image instead of a small thumbnail. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PixellWave — Your Vision, Our Wave" />
    <meta
      name="twitter:description"
      content="A creative studio for video, photo, branding, web design, social and events — from concept to final delivery."
    />
    <meta name="twitter:image" content="https://pixellwave.it/og-image.png" />

    <link rel="preload" as="font" type="font/woff2" href="/src/assets/fonts/hanken-grotesk.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/src/assets/fonts/hanken-grotesk-italic.woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
