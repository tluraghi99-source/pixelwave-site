<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- viewport-fit=cover lets fixed full-bleed elements (e.g. the mobile
         nav takeover) extend into the safe areas instead of stopping at
         their edge, so their background can show through under iOS
         Safari's translucent chrome the way the rest of the site does. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>PixelWave — Your Vision, Our Wave</title>
    <meta
      name="description"
      content="PixelWave è uno studio creativo per video, foto, branding, web design, social ed eventi: dall’idea alla consegna finale."
    />
    <link rel="canonical" href="https://pixelwave.it/" />
    <meta name="theme-color" content="#000000" />

    <!-- Open Graph — this static baseline is what every page shows when
         shared (Facebook, LinkedIn, WhatsApp, Slack, etc. read the raw
         HTML and never run this site's JS, so per-page OG tags aren't
         possible without server-side rendering). See PageMeta.tsx for the
         per-page <title>/description that DOES vary — search engines like
         Google run JS and do pick that up, unlike link-preview crawlers. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PixelWave" />
    <meta property="og:locale" content="it_IT" />
    <meta property="og:url" content="https://pixelwave.it/" />
    <meta property="og:title" content="PixelWave — Your Vision, Our Wave" />
    <meta
      property="og:description"
      content="Uno studio creativo per video, foto, branding, web design, social ed eventi: dall’idea alla consegna finale."
    />
    <meta property="og:image" content="https://pixelwave.it/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter/X reads Open Graph too, but only with this card type set
         does it render the large image instead of a small thumbnail. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PixelWave — Your Vision, Our Wave" />
    <meta
      name="twitter:description"
      content="Uno studio creativo per video, foto, branding, web design, social ed eventi: dall’idea alla consegna finale."
    />
    <meta name="twitter:image" content="https://pixelwave.it/og-image.png" />

    <!-- Structured data (schema.org JSON-LD): tells search engines who the
         studio is. Kept to facts shown elsewhere on the site (legal details
         are those of the privacy policy). Per-project data is added by
         ProjectPage.tsx. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://pixelwave.it/#organization",
            "name": "PixelWave",
            "legalName": "PIXEL WAVE S.r.l.",
            "url": "https://pixelwave.it/",
            "logo": "https://pixelwave.it/apple-touch-icon.png",
            "image": "https://pixelwave.it/og-image.png",
            "description": "Studio creativo per video, foto, branding, web design, social ed eventi: dall’idea alla consegna finale.",
            "email": "info@pixelwave.it",
            "vatID": "IT12315400965",
            "address": {
              "@type": "PostalAddress",
              "streetAddress": "Via G. Mussi 15",
              "postalCode": "20154",
              "addressLocality": "Milano",
              "addressCountry": "IT"
            },
            "sameAs": [
              "https://www.instagram.com/pixelwave_studio/",
              "https://www.youtube.com/@PixelWaveStudio",
              "https://www.linkedin.com/company/pixelwavestudio/"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://pixelwave.it/#website",
            "url": "https://pixelwave.it/",
            "name": "PixelWave",
            "inLanguage": "it-IT",
            "publisher": { "@id": "https://pixelwave.it/#organization" }
          }
        ]
      }
    </script>

    <link rel="preload" as="font" type="font/woff2" href="/src/assets/fonts/hanken-grotesk.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/src/assets/fonts/hanken-grotesk-italic.woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
